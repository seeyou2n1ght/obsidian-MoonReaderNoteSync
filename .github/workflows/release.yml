name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const m = require("./manifest.json"); if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== m.version) process.exit(1)'

      - name: Build plugin
        run: |
          npm ci
          npm run check

      - name: Check release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- "$RELEASE_TAG"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md
          files: |
            main.js
            manifest.json
            styles.css
